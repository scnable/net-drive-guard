[package]
name = "net-drive-guard-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
net-drive-guard-core = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"

net-drive-guard-windows = { path = "../windows" }

[lints.rust]
unsafe_code = "forbid"
